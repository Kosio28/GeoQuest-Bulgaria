<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./favicon.svg">
  <title>GeoQuest Bulgaria</title>
</head>
<body>
  <main>
    <header class="masthead">
      <a class="brand" href="./">GeoQuest <span>Bulgaria</span></a>
      <a class="lab-link" href="./lab.html">Panorama Lab</a>
      <p id="progress" hidden></p>
    </header>
    <section id="home" class="home">
      <p class="eyebrow">THE BULGARIA CHALLENGE</p>
      <h1>Where in Bulgaria?</h1>
      <p>Explore five street-level panoramas and pin each location on the map. Take your time: there’s no clock to beat.</p>
      <form id="start">
        <fieldset>
          <legend>Choose your mode</legend>
          <label><input type="radio" name="mode" value="classic" checked> <span><strong>Classic</strong><small>Move, look around, and zoom</small></span></label>
          <label><input type="radio" name="mode" value="no-move"> <span><strong>No Move</strong><small>Look around and zoom from one spot</small></span></label>
        </fieldset>
        <button class="primary" type="submit">Play</button>
      </form>
    </section>
    <section id="stage" class="stage" aria-label="Game round" hidden>
      <div id="viewer" hidden></div>
      <div id="loading" class="loading" hidden><p id="load-status" role="status"></p><button id="retry" type="button" hidden>Retry round</button></div>
      <div id="explore" class="explore" hidden>
        <p id="explore-status" role="status"></p>
        <div id="moves" class="moves" aria-label="Explore connected images"></div>
      </div>
      <div id="results" class="results" hidden>
        <div class="result-content">
          <p id="result-label" class="eyebrow"></p>
          <h1 id="result-title" tabindex="-1"></h1>
          <p id="result-stats"></p>
          <p class="legend"><span class="guess-key">●</span> Your guess <span class="actual-key">●</span> Actual location</p>
          <ol id="round-scores" hidden></ol>
          <button id="next" class="primary" type="button"></button>
        </div>
      </div>
      <div id="map-panel" class="map-panel" hidden>
        <button id="toggle-map" type="button" aria-expanded="false" aria-controls="map">Expand map</button>
        <div id="map" aria-label="Location map"></div>
        <p id="map-error" role="status" hidden></p>
        <button id="guess" class="primary" type="button" disabled>GUESS</button>
      </div>
      <p id="credits" class="credits" hidden>Imagery: <span id="creator"></span><a href="https://www.mapillary.com/">Mapillary</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA</a></p>
    </section>
  </main>
  <script type="module" src="/src/play.ts"></script>
</body>
</html>
